[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adam", email = "lavouver96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
